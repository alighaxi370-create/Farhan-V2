<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Facebook Callback</title>
</head>

<body>

<h2>Signing in...</h2>

<script>

const params = new URLSearchParams(window.location.search);

const code = params.get("code");
const error = params.get("error");

if(error){
    alert("Facebook Login Cancelled");
    window.location.href="/dashboard.html";
}

if(!code){
    alert("Login Failed");
    window.location.href="/dashboard.html";
}

fetch("https://farhan-v2-api.samongfrazsjahga.workers.dev/oauth?code="+encodeURIComponent(code))
.then(r=>r.json())
.then(data=>{

    if(data.access_token){

        localStorage.setItem("fb_access_token",data.access_token);

        window.location.href="/dashboard.html";

    }else{

        alert(JSON.stringify(data));

        window.location.href="/dashboard.html";

    }

})
.catch(err=>{

    alert(err);

    window.location.href="/dashboard.html";

});

</script>

</body>
</html>
