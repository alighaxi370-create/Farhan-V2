<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farhan V2</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="sidebar">

<div class="logo">

FB Creator Studio

</div>

<ul>

<li class="active">🏠 Dashboard</li>

<li onclick="location.href='modules/swipe-video/index.html'">📹 Swipe Video</li>

<li onclick="location.href='modules/carousel/index.html'">🖼 Carousel Post</li>

<li onclick="location.href='modules/onecard/index.html'">🌐 One Card Link</li>

<li>📄 Drafts</li>

<li>⚙ Settings</li>

</ul>

</div>

<div class="main">

<header>

<h2>Dashboard</h2>

<div class="user">

<button id="fbLoginBtn" class="continue-btn">
Connect Facebook
</button>

</div>

</header>

<section class="connect">

<div class="fb-user">

<img
id="fbAvatar"
src="https://placehold.co/70x70"
class="avatar"
>

<div>

<h2 id="fbName">
Not Connected
</h2>

<p id="fbStatus">
Please connect Facebook
</p>

</div>

</div>

</section>
  
<section class="pages">

<h2>My Pages</h2>

<div class="page-list">

<<div id="pagesContainer"></div>

<button class="continue-btn">
Continue
</button>

</div>

</section>
<section class="tools">

<div class="tool">

📹

<h3>

Swipe Video

</h3>

</div>

<div class="tool">

🖼

<h3>

Carousel Post

</h3>

</div>

<div class="tool">

🌐

<h3>

One Card

</h3>

</div>

</section>

</div>
<script>

const btn=document.getElementById("fbLoginBtn");

btn.onclick=()=>{

window.location.href="auth/login.html";

};

const code=localStorage.getItem("fb_auth_code");

if(code){

document.getElementById("fbName").textContent="Facebook Connected";

document.getElementById("fbStatus").textContent="Authorization Received";

btn.textContent="Connected";

btn.disabled=true;

}

</script>
</body>

</html>
