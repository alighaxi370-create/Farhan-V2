<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facebook Carousel Builder</title>

<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="carousel.css">

</head>

<body>

<div class="topbar">

<div class="logo">

<h2>Farhan V2</h2>

</div>

<div class="top-actions">

<button id="draftBtn" class="secondary-btn">

💾 Save Draft

</button>

<button id="publishBtn" class="primary-btn">

🚀 Publish

</button>

</div>

</div>

<div class="editor">

<!-- LEFT PANEL -->

<div class="left-panel">

<h2>Facebook Carousel</h2>

<!-- ========================= -->

<h3 class="card-heading">

Card 1

</h3>

<label>Image</label>

<div class="upload-box">

<input
type="file"
id="image1"
accept="image/*"
hidden>

<button
type="button"
onclick="document.getElementById('image1').click()">

Choose Image

</button>

</div>

<label>Title</label>

<input
type="text"
id="title1"
placeholder="Card 1 Title">

<label>Website</label>

<input
type="url"
id="url1"
placeholder="https://example.com">

<label>CTA</label>

<select id="cta1">

<option>Watch More</option>

<option>Learn More</option>

<option>Shop Now</option>

<option>Visit Website</option>

</select>

<hr>

<!-- ========================= -->

<h3 class="card-heading">

Card 2

</h3>

<label>Image</label>

<div class="upload-box">

<input
type="file"
id="image2"
accept="image/*"
hidden>

<button
type="button"
onclick="document.getElementById('image2').click()">

Choose Image

</button>

</div>

<label>Title</label>

<input
type="text"
id="title2"
placeholder="Card 2 Title">

<label>Website</label>

<input
type="url"
id="url2"
placeholder="https://example.com">

<label>CTA</label>

<select id="cta2">

<option>Watch More</option>

<option>Learn More</option>

<option>Shop Now</option>

<option>Visit Website</option>

</select>

</div>

<!-- RIGHT PANEL -->

<div class="right-panel">
  <h2>Facebook Preview</h2>

<div class="phone-frame">

<div class="fb-post">

<!-- Header -->

<div class="fb-header">

<div class="fb-avatar">F</div>

<div class="fb-page">

<strong>Farhan V2</strong>

<small>Sponsored</small>

</div>

</div>

<!-- Carousel -->

<div class="carousel-wrapper">

<!-- CARD 1 -->

<div class="carousel-card">

<img id="previewImg1" src="">

<div class="card-info">

<h4 id="previewTitle1">
Card 1 Title
</h4>

<p id="previewUrl1">
example1.com
</p>

<button id="previewCta1">
Watch More
</button>

</div>

</div>

<!-- CARD 2 -->

<div class="carousel-card">

<img id="previewImg2" src="">

<div class="card-info">

<h4 id="previewTitle2">
Card 2 Title
</h4>

<p id="previewUrl2">
example2.com
</p>

<button id="previewCta2">
Learn More
</button>

</div>

</div>

</div>

<!-- Facebook Actions -->

<div class="fb-actions">

<span>👍 Like</span>

<span>💬 Comment</span>

<span>↗ Share</span>

</div>

</div>

</div>

</div>

</div>

<script src="carousel.js"></script>

</body>
</html>
