<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe Video</title>

<link rel="stylesheet" href="../../assets/css/style.css">

</head>

<body>

<div class="editor">

<div class="left-panel">

<h2>Swipe Video Creator</h2>

<label>Upload Video</label>

<div class="upload-box" id="videoBox">
    <input type="file" id="videoInput" accept="video/*" hidden>
    <p>🎥 Drag Video Here</p>
    <button type="button" onclick="document.getElementById('videoInput').click()">
        Choose Video
    </button>
</div>
  
<label>Upload Thumbnail</label>

<div class="upload-box" id="thumbBox">
    <input type="file" id="thumbInput" accept="image/*" hidden>
    <p>🖼 Drag Image Here</p>
    <button type="button" onclick="document.getElementById('thumbInput').click()">
        Choose Image
    </button>
</div>

<label>Title</label>
<input type="text" id="titleInput" placeholder="Enter title">

<label>Website URL</label>
<input type="url" id="urlInput" placeholder="https://example.com">

<label>CTA Button</label>

<select id="ctaInput">

<option>Watch More</option>

<option>Learn More</option>

<option>Shop Now</option>

<option>Visit Website</option>

</select>

<button class="fb-login-btn">

Save Draft

</button>

<button class="fb-login-btn">

Publish

</button>

</div>

<div class="right-panel">

<h2>Mobile Preview</h2>

<div class="phone-preview">

<img id="thumbPreview" src="" style="width:100%;display:none;border-radius:20px 20px 0 0;">

<video id="videoPreview" controls style="width:100%;display:none;"></video>

<div style="padding:15px;">

<h3 id="titlePreview">Video Title</h3>

<p id="urlPreview">example.com</p>

<button id="ctaPreview" class="fb-login-btn">

Watch More

</button>

</div>

</div>

</div>

</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
